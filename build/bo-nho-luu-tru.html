<title>Bộ nhớ &amp; Lưu trữ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#c6ae8e;
    --ink:#241a12;
    --ink-soft:rgba(36,26,18,.6);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;
    touch-action:none;user-select:none;-webkit-user-select:none;
    touch-action:none;user-select:none;-webkit-user-select:none;
    opacity:0;transition:opacity 1s linear}
  canvas#gl.on{opacity:1}

  /* ---------- header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;height:60px;z-index:20;
    display:flex;align-items:center;padding:0 20px;gap:28px;
    font-size:16px;font-weight:500;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:26px;height:26px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
  .mark svg{width:15px;height:15px;fill:#efe7da}
  .brandname{font-family:"EB Garamond",Georgia,serif;font-size:23px;font-weight:500;
    letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
  header .right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .pill{background:var(--ink);color:#f6efe1;padding:11px 20px;border-radius:999px;
    text-decoration:none;white-space:nowrap}
  .pill:hover{background:#33291f}

  /* ---------- the opening: every element on its own beat ---------- */
  .rise{opacity:0;transform:translateY(13px);
    transition:opacity .74s var(--ease) var(--d,0ms),transform .74s var(--ease) var(--d,0ms)}
  .rise.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){
    .rise{transform:none;transition:opacity .3s linear var(--d,0ms)}
  }

  /* ---------- focused volume panel ---------- */
  .wash{position:fixed;left:0;top:0;z-index:14;height:100vh;
    width:min(664px,62vw);pointer-events:none;display:block}
  body.mobile .wash{display:none}
  .detail{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:15;
    width:min(560px,50vw);padding:92px 120px 92px 54px;opacity:0;pointer-events:none;
    transition:opacity .45s var(--ease) .14s}
  .detail .meta,.detail h2,.detail p,.detail .acts{max-width:326px}
  .detail.on{opacity:1}
  .detail .acts button{pointer-events:auto}
  .detail .meta{font-size:13px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 13px}
  .detail h2{font-family:"EB Garamond",Georgia,serif;font-weight:500;
    font-size:46px;line-height:1.06;margin:0 0 18px;letter-spacing:-.005em}
  .detail p{font:400 17px/1.62 Inter,sans-serif;margin:0 0 32px;color:rgba(36,26,18,.84)}
  .detail .acts{display:flex;gap:10px}
  .detail ul{max-width:326px;margin:-14px 0 30px;padding:0;list-style:none}
  .detail li{position:relative;padding-left:17px;margin:0 0 9px;
    font:400 14.5px/1.5 Inter,sans-serif;color:rgba(36,26,18,.84)}
  .detail li::before{content:"";position:absolute;left:0;top:.72em;width:8px;height:1.5px;background:var(--ink)}
  .detail .credit{max-width:326px;margin:22px 0 0;font:400 12px/1.45 Inter,sans-serif;color:var(--ink-soft)}
  /* projector type: the copy scales with the screen height, the rail below keeps its size */
  .wash{width:min(860px,64vw)}
  .detail{width:min(740px,52vw);padding:clamp(40px,7vh,90px) 120px clamp(40px,7vh,90px) 56px}
  .detail .meta,.detail h2,.detail p,.detail .acts,.detail ul,.detail .credit{max-width:470px}
  .detail .meta{font-size:clamp(13px,1.9vh,16px);margin-bottom:14px}
  .detail h2{font-size:clamp(40px,7vh,66px);margin-bottom:18px}
  .detail p{font-size:clamp(16.5px,2.6vh,22px);margin-bottom:26px}
  .detail li{font-size:clamp(15px,2.25vh,19px);margin-bottom:10px}
  .detail .acts button{font-size:clamp(14.5px,2vh,17px);padding:16px 26px}
  .detail .credit{font-size:12px}

  /* ---------- market dashboard, beside the copy ---------- */
  .dash{position:fixed;z-index:15;top:50%;right:clamp(16px,3vw,48px);
    width:min(700px,calc(100vw - min(740px,52vw) - 40px));max-height:calc(100vh - 140px);overflow:auto;
    background:rgba(253,248,239,.95);color:var(--ink);border-radius:18px;
    padding:clamp(16px,2.8vh,30px) clamp(18px,2.2vw,32px);
    box-shadow:0 2px 4px rgba(52,34,16,.12),0 18px 40px -12px rgba(52,34,16,.34);
    opacity:0;pointer-events:none;transform:translate(24px,-50%);
    transition:opacity .45s var(--ease) .2s,transform .7s var(--ease) .2s}
  .dash.on{opacity:1;pointer-events:auto;transform:translate(0,-50%)}
  body.mobile .dash{display:none}
  .dash .dk{margin:0 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .dash h3{margin:0 0 clamp(10px,2vh,18px);font:500 clamp(24px,3.6vh,34px)/1.1 "EB Garamond",Georgia,serif}
  .dash .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:clamp(10px,2vh,18px)}
  .dash .kpi{background:#f3ead9;border-radius:12px;padding:clamp(10px,1.6vh,14px) 14px}
  .dash .kpi b{display:block;font:500 clamp(22px,min(4.2vh,2.7vw),38px)/1 "EB Garamond",Georgia,serif;margin-bottom:6px;white-space:nowrap}
  .dash .kpi span{display:block;font-size:clamp(12px,1.6vh,13.5px);line-height:1.35;color:var(--ink-soft)}
  .dash .chart{margin:0 0 clamp(10px,2vh,18px)}
  .dash figcaption{font:500 clamp(13px,1.8vh,15px)/1.3 Inter,sans-serif;margin-bottom:8px}
  .dash .row{display:grid;grid-template-columns:minmax(120px,38%) 1fr 64px;align-items:center;gap:10px;
    font-size:clamp(12.5px,1.7vh,14.5px);padding:3px 0}
  .dash .lbl{color:rgba(36,26,18,.8);line-height:1.2}
  .dash .track{position:relative;height:clamp(12px,1.9vh,16px)}
  .dash .track i{position:absolute;top:0;bottom:0;left:var(--l,0);width:var(--w);background:#8c4a2f;
    border-radius:0 4px 4px 0;transform-origin:left;transform:scaleX(0)}
  .dash .track i.ext{background:rgba(140,74,47,.32);border-radius:0 4px 4px 0}
  .dash .track i.tgt{background:transparent;border:1.5px dashed #8c4a2f}
  .dash.on .track i{transform:scaleX(1);transition:transform .9s var(--ease) .45s}
  .dash .val{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
  .dash .years{display:grid;grid-template-columns:minmax(120px,38%) 1fr 64px;gap:10px;height:16px}
  .dash .axis{position:relative;font-size:11px;color:var(--ink-soft)}
  .dash .axis em{position:absolute;font-style:normal;transform:translateX(-50%)}
  .dash .note{margin:6px 0 0;font-size:12.5px;color:var(--ink-soft)}
  .dash .src{margin:0;font-size:11.5px;color:var(--ink-soft)}

  /* ---------- captions under the two drives of the comparison volume ---------- */
  .pair-cap{position:fixed;inset:0;z-index:14;pointer-events:none;opacity:0;transition:opacity .3s var(--ease)}
  .pair-cap.on{opacity:1;transition:opacity .5s var(--ease) .5s}
  .pair-cap div{position:absolute;top:calc(var(--y) + 14px);transform:translateX(-50%);text-align:center;
    width:max-content;max-width:19vw;transition:left .7s var(--ease)}
  #cap-a{left:var(--a)} #cap-b{left:var(--b)}
  .pair-cap b{display:block;font:500 clamp(17px,2.5vh,23px)/1.15 "EB Garamond",Georgia,serif;color:var(--ink)}
  .pair-cap span{display:block;margin-top:4px;font-size:clamp(12px,1.65vh,14px);line-height:1.35;color:var(--ink-soft)}
  body.mobile .pair-cap{display:none}

  /* ---------- Q&A drawer: ask Claude about the components ---------- */
  .chatpill{border:0;cursor:pointer;font:inherit;background:#fdf8ef;color:var(--ink);
    box-shadow:0 1px 1px rgba(52,34,16,.16),0 6px 14px -6px rgba(52,34,16,.32)}
  .chatpill:hover{background:#fffcf5}
  .chat{position:fixed;z-index:24;top:70px;bottom:118px;right:max(16px,env(safe-area-inset-right,0px));
    width:min(410px,calc(100vw - 32px));display:flex;flex-direction:column;overflow:hidden;
    background:#fdf8ef;color:var(--ink);border-radius:18px;
    box-shadow:0 2px 4px rgba(52,34,16,.14),0 24px 50px -16px rgba(52,34,16,.42)}
  .chat[hidden]{display:none}
  .chat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    padding:16px 18px 12px;border-bottom:1px solid rgba(36,26,18,.12)}
  .chat-k{margin:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .chat h3{margin:3px 0 0;font:500 25px/1.1 "EB Garamond",Georgia,serif}
  .chat-x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--ink);padding:2px 8px;border-radius:8px}
  .chat-log{flex:1;min-height:0;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
  .msg p{margin:0 0 6px}.msg p:last-child{margin:0}
  .msg ul{margin:4px 0 6px;padding-left:18px}.msg li{margin-bottom:3px}
  .msg.me{align-self:flex-end;background:var(--ink);color:#f6efe1;border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:#efe5d3;border-bottom-left-radius:4px}
  .msg.wait{color:var(--ink-soft);font-style:italic}
  .msg.note{align-self:center;background:none;padding:0;font-size:12.5px;color:var(--ink-soft);text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 12px}
  .chips button{border:1px solid rgba(36,26,18,.22);background:none;border-radius:999px;padding:7px 11px;
    font:400 12.5px/1.25 Inter,sans-serif;color:var(--ink);cursor:pointer;text-align:left}
  .chips button:hover{background:#efe5d3}
  .chat-form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid rgba(36,26,18,.12)}
  .chat-form textarea{flex:1;min-width:0;resize:none;border:1px solid rgba(36,26,18,.24);border-radius:12px;
    padding:9px 11px;font:400 14.5px/1.4 Inter,sans-serif;background:#fffdf8;color:var(--ink)}
  .chat-form button{border:0;border-radius:12px;padding:0 16px;font:500 14px Inter,sans-serif;cursor:pointer;
    background:var(--ink);color:#f6efe1}
  #chat-stop{display:none;background:#efe5d3;color:var(--ink)}
  .chat.busy #chat-stop{display:block}.chat.busy #chat-send{display:none}
  .chat-foot{margin:0;padding:0 18px 12px;font-size:11.5px;color:var(--ink-soft)}
  .chat button:focus-visible,.chat textarea:focus-visible,.chatpill:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .detail .acts button{
    font:500 14.5px/1 Inter,sans-serif;color:var(--ink);background:#fdf8ef;border:0;
    border-radius:999px;padding:15px 24px;cursor:pointer;
    transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .22s;
    box-shadow:0 1px 1px rgba(52,34,16,.18),
               0 3px 6px rgba(52,34,16,.14),
               0 10px 20px -6px rgba(52,34,16,.26),
               0 26px 44px -18px rgba(52,34,16,.34),
               inset 0 1px 0 rgba(255,255,255,.85)}
  .detail .acts button:hover{background:#fffcf5;transform:translateY(-2px);
    box-shadow:0 1px 1px rgba(52,34,16,.18),
               0 5px 10px rgba(52,34,16,.16),
               0 16px 28px -8px rgba(52,34,16,.28),
               0 36px 60px -22px rgba(52,34,16,.38),
               inset 0 1px 0 rgba(255,255,255,.9)}
  .detail .acts button:active{transform:translateY(0);
    box-shadow:0 1px 2px rgba(52,34,16,.22),0 4px 10px -2px rgba(52,34,16,.24),
               inset 0 1px 0 rgba(255,255,255,.7)}

  .hint{position:fixed;z-index:16;left:0;top:0;transform:translate(10px,10px);
    background:#fdf8ef;color:var(--ink);border-radius:999px;padding:8px 13px;
    font:500 13.5px/1 Inter,sans-serif;box-shadow:0 2px 14px rgba(50,35,20,.2);
    pointer-events:none;opacity:0;transition:opacity .5s}
  .hint.on{opacity:1}

  /* ---------- catalogue rail ---------- */
  footer{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:30px 0 22px;
    background:linear-gradient(to top,rgba(198,174,142,.94) 46%,rgba(198,174,142,.62) 76%,rgba(198,174,142,0));
    border-top:1px solid rgba(36,26,18,.16);opacity:0;transition:opacity .7s var(--ease) .34s}
  footer.on{opacity:1}
  body.reading footer{opacity:.3}
  .tl{display:flex;justify-content:space-between;align-items:center;
    gap:clamp(9px,1.2vw,22px);padding:0 clamp(14px,2.5vw,44px);
    overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%)}
  .tl::-webkit-scrollbar{display:none}
  .tl>*{flex:0 1 auto;min-width:0}
  .tli{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;
    flex:0 0 auto;display:flex;align-items:center;gap:11px}
  .tlmark{flex:0 0 auto;width:44px;height:36px;object-fit:contain;opacity:.8;
    transition:opacity .4s var(--ease),transform .4s var(--ease)}
  .tli:hover .tlmark{opacity:.95;transform:translateY(-1px) scale(1.06)}
  .tltxt{display:block;min-width:0;white-space:nowrap}
  .tli p{margin:0;font-size:12.5px;line-height:1.24;color:var(--ink-soft);transition:color .45s}
  .tli p.studio{margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tli h2{margin:0;font-size:14px;font-weight:400;line-height:1.22;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tli:hover p{color:var(--ink)}

  /* ---------- mobile: the stack you flick through ---------- */
  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:18;display:none;
    align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 16px 22px;
    opacity:0;transition:opacity .6s var(--ease)}
  .mbar.on{opacity:1}
  .mbar-txt p{margin:0 0 4px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .mbar-txt h2{margin:0;font-family:"EB Garamond",Georgia,serif;font-size:24px;font-weight:500;line-height:1.12}
  .mbar-acts{display:flex;gap:8px;flex:0 0 auto}
  .mbar-acts button{font:500 14.5px/1 Inter,sans-serif;border:0;border-radius:999px;
    padding:15px 21px;
    box-shadow:0 1px 1px rgba(52,34,16,.18),0 4px 9px rgba(52,34,16,.16),
               0 14px 26px -8px rgba(52,34,16,.30),inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer;background:rgba(253,247,236,.9);color:var(--ink)}
  .mbar-acts button.solid{background:var(--ink);color:#f2ece1}
  .menubtn{position:fixed;right:14px;top:10px;z-index:22;width:34px;height:34px;border:0;
    background:none;display:none;flex-direction:column;justify-content:center;gap:6px;cursor:pointer}
  .menubtn span{display:block;height:1.8px;background:var(--ink);border-radius:2px}
  .menu{position:fixed;inset:0;z-index:21;background:rgba(206,186,157,.97);backdrop-filter:blur(14px);
    padding:66px 20px 24px;display:flex;flex-direction:column;overflow:auto}
  .menu[hidden]{display:none}
  .menu button{background:none;border:0;text-align:left;padding:13px 4px;cursor:pointer;
    border-bottom:1px solid rgba(36,26,18,.14);color:var(--ink);
    font-family:"EB Garamond",Georgia,serif;font-size:21px}
  .menu button span{display:block;margin-bottom:4px;font-family:Inter,sans-serif;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}

  body.mobile footer{display:none}
  body.mobile .mbar{display:flex;padding-top:52px;
    background:linear-gradient(to top,rgba(198,174,142,.97) 34%,rgba(198,174,142,.72) 68%,rgba(198,174,142,0))}
  body.mobile .menubtn{display:flex}
  body.mobile header{padding:0 14px;gap:10px}
  body.mobile header .right{margin-right:42px}
  body.mobile .detail{display:none}
  .mbar{background:linear-gradient(to top, rgba(203,182,152,.96), rgba(203,182,152,0))}

  /* ---------- loader ---------- */
  .loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;
    background:var(--bg);transition:opacity .6s linear;pointer-events:none}
  .loader.gone{opacity:0}
  .bar{width:92px;height:2px;background:rgba(29,24,21,.2);position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:var(--ink);
    transition:transform .3s linear}
</style>

<canvas id="gl"></canvas>

<header>
  <div class="brand">
    <span class="mark rise" data-d="0"><svg viewBox="0 0 24 24"><path d="M7 7h10v10H7z"/><path d="M9 3h1.6v3H9zM13.4 3H15v3h-1.6zM9 18h1.6v3H9zM13.4 18H15v3h-1.6zM3 9h3v1.6H3zM3 13.4h3V15H3zM18 9h3v1.6h-3zM18 13.4h3V15h-3z"/></svg></span>
    <span class="brandname rise" data-d="70">Bộ nhớ &amp; Lưu trữ</span>
  </div>
  <div class="right">
    <button class="pill chatpill rise" data-d="240" id="chat-open" hidden>Hỏi đáp</button>
    <a class="pill rise" data-d="285" href="https://thanhnien.vn/khung-hoang-gia-ram-keo-dai-den-tan-nam-2030-185260319092018273.htm" target="_blank" rel="noopener">Nguồn tham khảo</a>
  </div>
</header>

<canvas class="wash" id="wash" aria-hidden="true"></canvas>
<div class="detail" id="detail">
  <p class="meta" id="detail-meta"></p>
  <h2 id="detail-title"></h2>
  <p id="detail-desc"></p>
  <ul id="detail-pts"></ul>

</div>

<div class="dash" id="dash"></div>
<div class="pair-cap" id="pair-cap" aria-hidden="true"><div id="cap-a"></div><div id="cap-b"></div></div>
<aside class="chat" id="chat" hidden aria-label="Hỏi đáp về linh kiện">
  <div class="chat-head">
    <div><p class="chat-k">Hỏi đáp</p><h3>Hỏi Claude về linh kiện</h3></div>
    <button class="chat-x" id="chat-close" aria-label="Đóng hỏi đáp">×</button>
  </div>
  <div class="chat-log" id="chat-log" aria-live="polite">
    <div class="msg ai"><p>Hỏi bất cứ điều gì về RAM, ổ cứng hay các linh kiện máy tính khác. Câu trả lời bám theo nội dung bài thuyết trình.</p></div>
  </div>
  <div class="chips" id="chat-chips">
    <button type="button">Vì sao RAM mất dữ liệu khi tắt máy?</button>

  <div class="mbar-acts">

    <button class="solid" id="mbar-look">Lật sau</button>
  </div>
</div>
<button class="menubtn" id="menubtn" aria-label="Mục lục"><span></span><span></span></button>

const TAU = Math.PI*2;
const SANS  = 'Inter,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif';
const SERIF = '"EB Garamond",Didot,"Bodoni 72",Georgia,"Times New Roman",serif';
const MONO  = 'ui-monospace,"SF Mono",Menlo,Monaco,Consolas,monospace';

const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp  = (a,b,t)=>a+(b-a)*t;
const smooth= t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function C(w,h){const c=document.createElement('canvas');c.width=w;c.height=h===undefined?w:h;return c;}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function lg(g,x0,y0,x1,y1,stops){const t=g.createLinearGradient(x0,y0,x1,y1);for(const s of stops)t.addColorStop(s[0],s[1]);return t;}
function rg(g,x,y,r0,r1,stops,x1,y1){const t=g.createRadialGradient(x,y,r0,x1===undefined?x:x1,y1===undefined?y:y1,r1);for(const s of stops)t.addColorStop(s[0],s[1]);return t;}
function tracked(g,text,x,y,track,align){
  let w=0;for(const ch of text)w+=g.measureText(ch).width+track;w-=track;
  let cx = align==='center'? x-w/2 : align==='right'? x-w : x;
  const prev=g.textAlign;g.textAlign='left';
  for(const ch of text){g.fillText(ch,cx,y);cx+=g.measureText(ch).width+track;}
  g.textAlign=prev;return w;
}
function fitTracked(g,text,w,weight,family,track){
  let lo=4,hi=3000;
  const meas=px=>{g.font=`${weight} ${px}px ${family}`;let t=0;for(const ch of text)t+=g.measureText(ch).width+track*px;return t-track*px;};
  for(let i=0;i<26;i++){const m=(lo+hi)/2;if(meas(m)>w)hi=m;else lo=m;}
  g.font=`${weight} ${lo}px ${family}`;return lo;
}
function grain(g,W,H,amount,seed){
  const r=mulberry(seed||7);const img=g.getImageData(0,0,W,H),d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(r()-0.5)*amount;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  g.putImageData(img,0,0);
}
function cloth(g,W,H,seed,amt){
  const r=mulberry(seed||3);
  g.save();g.globalAlpha=amt===undefined?.05:amt;
  for(let y=0;y<H;y+=3){g.fillStyle=r()>.5?'#fff':'#000';g.fillRect(0,y,W,1);}
  for(let x=0;x<W;x+=3){g.fillStyle=r()>.5?'#fff':'#000';g.fillRect(x,0,1,H);}
  g.restore();
}
function rule(g,x0,y0,x1,y1,col,w){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();}

const loadImg=src=>new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src;});
function twin(im){                                // two sticks of a dual-channel kit, one above the other
  const gap=Math.round(im.height*.35), c=C(im.width,im.height*2+gap), g=c.getContext('2d');
  g.drawImage(im,0,0); g.drawImage(im,0,im.height+gap); return c;
}
function backOf(front,mode,col){                  // for photos that only show one side
  const c=C(front.width,front.height), g=c.getContext('2d');
  g.translate(c.width,0); g.scale(-1,1); g.drawImage(front,0,0); g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation='source-atop';
  if(mode==='mirror'){ g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(0,0,c.width,c.height); return c; }
  g.fillStyle=col; g.fillRect(0,0,c.width,c.height);
  g.fillStyle=lg(g,0,0,0,c.height,[[0,'rgba(255,255,255,.16)'],[.5,'rgba(255,255,255,0)'],[1,'rgba(0,0,0,.25)']]);
  g.fillRect(0,0,c.width,c.height);
  const r=mulberry(c.width);                      // brushed finish
  for(let i=0;i<900;i++){g.fillStyle=r()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.06)';
    g.fillRect(r()*c.width,r()*c.height,c.width*(.05+r()*.2),1);}
  return c;
}
async function loadPlates(){
  const im={};                                    // every photo at once: on the web they are separate files
  await Promise.all(Object.keys(ASSET).map(async k=>{ im[k]=await loadImg(ASSET[k]); }));
  for(const b of BOOKS){
    const d=b.dev;
    let front=im[d.f];
    if(d.twin) front=twin(front);
    const back=d.b ? im[d.b] : backOf(front,d.backMode,d.backCol);
    PLATE[b.id]={front,back};
    if(d.pair) PLATE[b.id+'+']={front:im[d.pair.f],back:im[d.pair.b]};
  }
}

/* ---------- oak ---------- */
function woodTexture(px){
  const W=px, Hh=Math.round(px*0.5);
  const c=C(W,Hh),g=c.getContext('2d'),r=mulberry(909);
  g.fillStyle='#7d5228';g.fillRect(0,0,W,Hh);
  // sapwood/heartwood drift, kept low-contrast so it never reads as plywood
  for(let i=0;i<14;i++){
    g.fillStyle=`rgba(${146+r()*40|0},${98+r()*26|0},${48+r()*22|0},${.06+r()*.09})`;
    g.beginPath();g.ellipse(r()*W,r()*Hh,W*(.10+r()*.30),Hh*(.06+r()*.20),0,0,TAU);g.fill();
  }
  // the grain itself: many tight, slightly wandering lines
  for(let i=0;i<430;i++){
    const y0=r()*Hh, amp=Hh*(.004+r()*.020), f=0.6+r()*2.2, ph=r()*TAU;
    const dark=r()<.34;
    g.strokeStyle=dark
      ? `rgba(${38+r()*26|0},${22+r()*16|0},${9+r()*10|0},${.36+r()*.55})`
      : `rgba(${186+r()*40|0},${138+r()*32|0},${80+r()*26|0},${.14+r()*.32})`;
    g.lineWidth=dark?(0.8+r()*1.8):(0.8+r()*2.6);
    g.beginPath();
    for(let x=0;x<=W;x+=8){
      const y=y0+Math.sin(x/W*TAU*f+ph)*amp+Math.sin(x/W*TAU*f*2.7+ph*2)*amp*.4;
      x?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.stroke();
  }
  // cathedral figure — a few nested arcs, low contrast
  for(let k=0;k<4;k++){
    const cx=W*(.1+r()*.8), cy=Hh*(.15+r()*.7), sw=W*(.02+r()*.05);
    for(let i=0;i<14;i++){
      g.strokeStyle=`rgba(${62+r()*26|0},${38+r()*18|0},${16+r()*12|0},${.12+r()*.20})`;
      g.lineWidth=0.8+r()*1.6;
      g.beginPath();
      g.moveTo(cx-sw*(1+i*.30),cy+Hh*.5);
      g.quadraticCurveTo(cx,cy-Hh*(.12+i*.05),cx+sw*(1+i*.30),cy+Hh*.5);
      g.stroke();
    }
  }
  // medullary rays + open pores
  for(let i=0;i<520;i++){
    g.fillStyle=`rgba(${208+r()*26|0},${172+r()*28|0},${118+r()*28|0},${.05+r()*.15})`;
    g.fillRect(r()*W,r()*Hh,1+r()*2,Hh*(.01+r()*.05));
  }
  for(let i=0;i<9000;i++){
    g.fillStyle=`rgba(${44+r()*28|0},${26+r()*16|0},${10+r()*10|0},${.12+r()*.34})`;
    g.fillRect(r()*W,r()*Hh,1+r()*4,1);
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;
  return t;
}

/* tiling paper tooth — fibres, mottle and a fine grain */
function paperTexture(px){
  const c=C(px,px),g=c.getContext('2d'),r=mulberry(2027);
  g.fillStyle='#808080';g.fillRect(0,0,px,px);
  for(let i=0;i<70;i++){
    g.fillStyle=`rgba(${r()<.5?255:0},${r()<.5?255:0},${r()<.5?255:0},${.012+r()*.03})`;
    g.beginPath();g.ellipse(r()*px,r()*px,px*(.05+r()*.28),px*(.04+r()*.22),r()*TAU,0,TAU);g.fill();
  }
  for(let i=0;i<5200;i++){
    const x=r()*px,y=r()*px,l=1+r()*px*0.035,a=r()*TAU;
    g.strokeStyle=r()<.5?`rgba(255,255,255,${.03+r()*.11})`:`rgba(0,0,0,${.03+r()*.13})`;
    g.lineWidth=r()<.85?1:2;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  const img=g.getImageData(0,0,px,px),d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(r()-0.5)*40;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;
  t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;
  return t;
}
function wallTexture(px){
  const c=C(px,px),g=c.getContext('2d');
  const Ww=WALL.x1-WALL.x0, Hh=WALL.y1-WALL.y0;
  const img=g.createImageData(px,px), d=img.data, LUM=new Float32Array(px*px);
  const PT=K.shelfTop, PB=[K.shelfTop[0]-K.plankThick, K.shelfTop[1]-K.plankThick];
  const sm=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
  const r=mulberry(5);
  for(let j=0;j<px;j++){
    const y = WALL.y1 - (j+0.5)/px*Hh;
    for(let i=0;i<px;i++){
      const x = WALL.x0 + (i+0.5)/px*Ww;
      const ax=Math.abs(x)/WT.bellR;
      let L = WT.peak - WT.bell*ax*ax + WT.rightLift*clamp(x/4,0,1);
      L -= WT.vFall*sm((WT.vStart-y)/WT.vRange)*sm((-x+2.8)/8.6);
      const inPlank = 1-sm((Math.abs(x)-WT.plankHalf)/WT.plankFeather);
      const inShadow = sm((x-WT.shLeft)/WT.shLeftFeather)*(1-sm((x-WT.shRight)/WT.shRightFeather));
      for(const pt of PT){
        const dy=y-pt; if(dy<0||dy>WT.bounceR) continue;
        L += WT.bounce*Math.pow(1-dy/WT.bounceR,WT.bouncePow)*inPlank;
      }
      const rb=sm((x+4.8)/9.6);
      let dy=PB[0]-y;
      if(dy>0&&dy<WT.shTopR) L *= 1-WT.shTop*(1-(1-WT.shRightMul)*rb)*Math.pow(1-dy/WT.shTopR,WT.shPow)*inShadow;
      dy=PB[1]-y;
      if(dy>0&&dy<WT.shBotR) L *= 1-WT.shBot*(1-(1-WT.shBotRightMul)*rb)*Math.pow(1-dy/WT.shBotR,WT.shPow)*inShadow;
      // the uprights sit proud of the wall and drop a soft edge shadow
      for(const ux of [-3.40,3.40]){
        const dx=x-ux;
        const s=Math.exp(-Math.pow((dx+ (ux<0?0.30:-0.06))/0.40,2));
        const band=sm((y+3.6)/1.6)*(1-sm((y-1.9)/1.7));   // no hard ends
        L *= 1-0.30*s*band;
      }
      const o=(j*px+i)*4;
      const n=(r()-0.5)*5;            // limewash tooth
      LUM[j*px+i]=L;
      d[o]  =clamp((L+n)*WT.tint[0],0,255);
      d[o+1]=clamp((L+n)*WT.tint[1],0,255);
      d[o+2]=clamp((L+n)*WT.tint[2],0,255);
      d[o+3]=255;
    }
  }
  // the inside of the case, lit by the same baked light as the room around it
  const cd=caseArt(px).getContext('2d').getImageData(0,0,px,px).data;
  for(let p=0;p<px*px;p++){
    const a=cd[p*4+3]/255; if(!a) continue;
    const s=Math.pow(clamp(LUM[p]/WT.peak,0,1.2),1.4)*1.08, o=p*4;
    for(let k=0;k<3;k++) d[o+k]=d[o+k]*(1-a)+clamp(cd[o+k]*s,0,255)*a;
  }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
  t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;
  return t;
}

const WOOD_TEX = steelTexture(1024);
function oakMaterial(axis){
  return new THREE.ShaderMaterial({
    transparent:true,
    uniforms:{uWood:{value:WOOD_TEX},uOpacity:{value:0},uAxis:{value:axis||0}},
    vertexShader:`
      varying vec3 vP; varying vec3 vN;
      void main(){ vP=position; vN=normalize(normalMatrix*normal);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform sampler2D uWood; uniform float uOpacity; uniform float uAxis;
      varying vec3 vP; varying vec3 vN;
      void main(){
        vec3 n=normalize(vN), an=abs(n);
        vec2 uvH, uvV, uvE;
        if(uAxis<0.5){                       // grain runs along X (shelves)
          uvH=vec2(vP.x*0.140, vP.z*0.30);
          uvV=vec2(vP.x*0.140, vP.y*0.44);
          uvE=vec2(vP.z*0.30,  vP.y*0.44);
        } else {                             // grain runs along Y (uprights)
          uvH=vec2(vP.y*0.100, vP.z*0.30);
          uvV=vec2(vP.y*0.100, vP.x*0.55);
          uvE=vec2(vP.z*0.30,  vP.x*0.55);
        }
        vec2 uv=mix(mix(uvV,uvH,an.y),uvE,an.x);
        vec3 wood=texture2D(uWood,uv).rgb;
        float up=max(n.y,0.0), dn=max(-n.y,0.0), fwd=max(n.z,0.0), side=abs(n.x);
        float t = 1.22*up + 0.14*dn + 0.86*fwd + 0.48*side;
        float ao = mix(0.66,1.0, clamp((vP.z+0.42)/0.66,0.0,1.0));
        t *= mix(1.0, ao, up);
        t *= mix(0.88,1.0, 1.0-pow(clamp(abs(vP.x)/3.34,0.0,1.0),8.0));
        vec3 col = wood*t;
        // planed arris catching the light along the front top edge
        float arris = smoothstep(0.30,0.50,vP.z*2.0+0.5)*pow(clamp(n.z,0.0,1.0),1.5);
        col += vec3(0.10,0.082,0.055)*arris;
        col += vec3(0.05,0.040,0.026)*pow(clamp(n.z,0.0,1.0),5.0);    // satin sheen
        gl_FragColor=vec4(col,uOpacity);
        #include <colorspace_fragment>
      }`});
}

}
const SHADOW_TEX=shadowTex(), CONTACT_TEX=contactTex(), CREASE_TEX=creaseTex();

/* ---- cover surface: printed board under a satin varnish ---- */
const BOARD_FN = `
  // height field of a bound board: a shallow bulge that falls into a crisp chamfer
  float board(vec2 t){
    vec2 c=t*2.0-1.0;
    float bulge=(1.0-c.x*c.x)*(1.0-0.55*c.y*c.y);
    float e=clamp(min(min(t.x,1.0-t.x),min(t.y,1.0-t.y))/uER,0.0,1.0);
    float roll=sqrt(max(1.0-(1.0-e)*(1.0-e),0.0));   // quarter round, sharp at the lip
    return uBow*bulge*roll-uChamf*(1.0-roll);
  }`;
const COVER_VS = `
  uniform float uBow, uChamf, uER, uW, uH;
  varying vec2 vUv; varying vec3 vT, vB2, vNf; varying vec3 vWV;
  ${BOARD_FN}
  void main(){
    vUv=uv;
    vec3 pos=position; pos.z+=board(uv);
    mat3 M=mat3(modelMatrix);
    vT=normalize(M*vec3(1.0,0.0,0.0));
    vB2=normalize(M*vec3(0.0,1.0,0.0));
    vNf=normalize(M*vec3(0.0,0.0,1.0));
    vec4 wp=modelMatrix*vec4(pos,1.0);
    vWV=cameraPosition-wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp; }`;
const COVER_FS = `
  uniform sampler2D uTex; uniform float uSatin; uniform float uOpacity; uniform float uSeed;
  uniform float uBow, uChamf, uER, uW, uH;
  varying vec2 vUv; varying vec3 vT, vB2, vNf; varying vec3 vWV;
  ${BOARD_FN}
  float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
    p3+=dot(p3,p3.yxz+33.33); return fract((p3.x+p3.y)*p3.z); }
  float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
  void main(){
    vec2 uv=clamp(vUv,0.0008,0.9992);
    vec4 tex=texture2D(uTex,uv);
    if(tex.a<0.5) discard;                 // the photo's cut-out is the device's outline

    // the board normal is evaluated per pixel, so the chamfer stays crisp
    // however coarse the mesh is
    float d=0.0016;
    float hx=(board(uv+vec2(d,0.0))-board(uv-vec2(d,0.0)))/(2.0*d*uW);
    float hy=(board(uv+vec2(0.0,d))-board(uv-vec2(0.0,d)))/(2.0*d*uH);

    // linen tooth, as a small extra slope
    vec2 q=uv*vec2(58.0,78.0)+uSeed;
    float tooth=vnoise(q)*0.6+vnoise(q*2.7)*0.4;
    vec2 g2=uv*9.0+uSeed;
    float n1=vnoise(g2), e=0.02;
    vec2 grain=vec2(vnoise(g2+vec2(e,0.0))-n1, vnoise(g2+vec2(0.0,e))-n1)/e;

    vec3 N=normalize(vNf
      - vT*(hx + (grain.x*0.0022+(tooth-0.5)*0.009)*uSatin)
      - vB2*(hy + (grain.y*0.0022+(tooth-0.5)*0.009)*uSatin));
    vec3 V=normalize(vWV);

    // one key from above and to the right, a broad fill bounced off the paper wall
    vec3 L=normalize(vec3(0.52,0.70,0.55));
    vec3 F=normalize(vec3(-0.35,-0.18,0.92));
    float key=max(dot(N,L),0.0);
    float fill=max(dot(N,F),0.0);
    float shade=0.70+0.34*key+0.14*fill;
    vec3 col=tex.rgb*shade;

    // a tight specular that only fires on the chamfer, plus a broad satin lobe
    vec3 Hv=normalize(L+V);
    float nh=max(dot(N,Hv),0.0);
    col+=vec3(pow(nh,110.0)*0.85*uSatin);
    col+=vec3(pow(nh,14.0)*0.045*uSatin);
    float fres=pow(1.0-max(dot(N,V),0.0),3.4);
    col+=vec3(fres*0.055*uSatin);
    col+=vec3((tooth-0.5)*0.010*uSatin);

    gl_FragColor=vec4(min(col,vec3(1.0)),uOpacity);
    #include <colorspace_fragment>
  }`;
const SPINE_VS = `
  uniform float uHD;
  varying vec2 vUv; varying vec3 vNw, vTw, vBw, vWV; varying float vZ;
  void main(){
    vUv=uv;
    mat3 M=mat3(modelMatrix);
    vNw=normalize(M*normal);
    vTw=normalize(M*vec3(0.0,0.0,1.0));   // across the back
    vBw=normalize(M*vec3(0.0,1.0,0.0));   // head to tail
    vZ=position.z/uHD;
    vec4 wp=modelMatrix*vec4(position,1.0);
    vWV=cameraPosition-wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp; }`;
const SPINE_FS = `
  uniform sampler2D uTex; uniform float uOpacity; uniform float uSeed; uniform float uSatin;
  varying vec2 vUv; varying vec3 vNw, vTw, vBw, vWV; varying float vZ;
  float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
    p3+=dot(p3,p3.yxz+33.33); return fract((p3.x+p3.y)*p3.z); }
  float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
  void main(){
    vec4 tex=texture2D(uTex,clamp(vUv,0.0015,0.9985));
    float t=clamp(vZ,-1.0,1.0);
    // a hollow back: nearly flat down the middle, turning hard into the joints.
    // swept as an angle rather than a slope so the normal can reach the joints
    float ang=1.15*sign(t)*pow(abs(t),1.25);

    vec2 q=vUv*vec2(11.0,78.0)+uSeed;
    float tooth=vnoise(q)*0.6+vnoise(q*2.7)*0.4;
    vec3 N=normalize(vNw*cos(ang) + vTw*sin(ang)
                     + (vTw*0.009+vBw*0.009)*(tooth-0.5)*uSatin);
    vec3 V=normalize(vWV);

    vec3 L=normalize(vec3(0.52,0.70,0.55));
    vec3 F=normalize(vec3(-0.35,-0.18,0.92));
    float shade=0.70+0.34*max(dot(N,L),0.0)+0.14*max(dot(N,F),0.0);
    shade*=1.0-0.16*smoothstep(0.78,1.0,abs(t));      // the joint grooves
    vec3 col=tex.rgb*shade;

    // the key sits off to the right, so on the back it only ever grazes the
    // front joint — the bounce off the paper wall is what rakes the round
    vec3 Hv=normalize(L+V), Hf=normalize(F+V);
    float nh=max(dot(N,Hv),0.0), nf=max(dot(N,Hf),0.0);
    col+=vec3(pow(nh,110.0)*0.55*uSatin);
    col+=vec3(pow(nh,14.0)*0.045*uSatin);
    col+=vec3(pow(nf,46.0)*0.150*uSatin);
    col+=vec3(pow(nf,9.0)*0.032*uSatin);
    col+=vec3(pow(1.0-max(dot(N,V),0.0),3.4)*0.055*uSatin);
    col+=vec3((tooth-0.5)*0.010*uSatin);

    gl_FragColor=vec4(min(col,vec3(1.0)),uOpacity);
    #include <colorspace_fragment>
  }`;
function spineMaterial(tex,seed){
  return new THREE.ShaderMaterial({transparent:true,
    uniforms:{uTex:{value:tex},uOpacity:{value:0},uSeed:{value:seed},
              uSatin:{value:1.0},uHD:{value:K.bookD*0.5}},
    vertexShader:SPINE_VS,fragmentShader:SPINE_FS});
}
function pagesMaterial(col){
  return new THREE.ShaderMaterial({
    transparent:true,
    uniforms:{uCol:{value:new THREE.Color(col)},uOpacity:{value:0},uH:{value:K.bookH*0.5}},
    vertexShader:`
      varying vec3 vP; varying vec3 vNw; varying vec3 vWV;
      void main(){ vP=position; vNw=normalize(mat3(modelMatrix)*normal);
        vec4 wp=modelMatrix*vec4(position,1.0);
        vWV=cameraPosition-wp.xyz;
        gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`
      uniform vec3 uCol; uniform float uOpacity; uniform float uH;
      varying vec3 vP; varying vec3 vNw; varying vec3 vWV;
      void main(){
        float f=vP.z*210.0;
        float w=fwidth(f);
        float line=0.5+0.5*cos(f*6.2831853);
        line=mix(0.5,line,clamp(1.0-w*1.6,0.0,1.0));
        vec3 col=uCol*0.88*mix(0.76,1.04,line);
        col*=1.0-0.16*smoothstep(0.25,1.0,abs(vP.y)/uH);
        col*=0.90+0.10*smoothstep(-0.09,0.09,vP.z);

        // the same rig as the boards, so the block turns with the volume
        vec3 N=normalize(vNw), V=normalize(vWV);
        vec3 L=normalize(vec3(0.52,0.70,0.55));
        vec3 F=normalize(vec3(-0.35,-0.18,0.92));
        float shade=0.70+0.34*max(dot(N,L),0.0)+0.14*max(dot(N,F),0.0);
        shade*=1.0-0.36*max(-N.y,0.0);      // the tail sits in its own shadow
        col*=shade/0.871;                   // 0.871 holds the fore-edge at its old tone
        // paper carries no real specular, only a graze
        col+=uCol*pow(1.0-max(dot(N,V),0.0),3.2)*max(dot(N,L),0.0)*0.11;
        gl_FragColor=vec4(min(col,vec3(1.0)),uOpacity);
        #include <colorspace_fragment>
      }`});
}

/* ---- tweens ---- */
const easeOutQuart=t=>1-Math.pow(1-t,4);
const easeSettle  =t=>t<0.5? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const activeEase  =t=>t<0.3? 0.3*Math.pow(t/0.3,3) : 0.3+0.7*(1-Math.pow(1-(t-0.3)/0.7,3));
let NOW=0;
class Tw{
  constructor(v){this.v=v.slice();this.from=v.slice();this.to=v.slice();this.t0=0;this.d=0;this.e=easeOutQuart;}
  start(to,d,e,delay){this.from=this.v.slice();this.to=to.slice();this.t0=NOW+(delay||0);this.d=Math.max(d,1);this.e=e||easeOutQuart;}
  set(to){this.v=to.slice();this.from=to.slice();this.to=to.slice();this.d=0;}
  update(){ if(this.d<=0)return;
    let t=(NOW-this.t0)/this.d; if(t<0)return; if(t>=1){t=1;this.d=0;}
    const k=this.e(t); for(let i=0;i<this.v.length;i++)this.v[i]=this.from[i]+(this.to[i]-this.from[i])*k; }
}
class Spring{
  constructor(v,tension,friction,mass){this.v=v.slice();this.tgt=v.slice();this.vel=v.map(()=>0);
    this.k=tension;this.c=friction;this.m=mass||1;}
  start(t){this.tgt=t.slice();}
  update(dt){dt=Math.min(dt,1/30);
    for(let i=0;i<this.v.length;i++){
      const a=(this.k*(this.tgt[i]-this.v[i])-this.c*this.vel[i])/this.m;
      this.vel[i]+=a*dt;this.v[i]+=this.vel[i]*dt;}}
}

/* ---- one device ---- */
const SZW=K.bookW, SZH=K.bookH, SZD=K.bookD;           // the slot a device stands in
const MM=K.bookH/147;                                   // world units per mm: a 3.5" drive fills the slot
const mPos=(i,scroll)=>{
  const k=i-(scroll||0);
  if(k>=0) return [0, K.mY + k*K.mStepY, K.mZ0 - k*K.mStepZ];
  return [0, K.mY + k*0.86, K.mZ0 - k*0.14];
};
const slotX=i=>(i-1.5)*K.slot;                   // four devices per shelf, centred
function bookBase(b){
  if(MOBILE) return mPos(b.index,0);
  return [slotX(b.data.slot), K.shelfTop[b.data.shelf]+(b.H/2)*Math.cos(b._lean), K.bookZ];
}
/* a landscape photo turns a quarter so the device stands on its end in the slot;
   the back turns the other way so it reads upright once the device is flipped */
function faceTex(img,land,cw){
  let src=img;
  if(land){
    src=C(img.height,img.width); const g=src.getContext('2d');
    g.translate(src.width/2,src.height/2); g.rotate(cw?Math.PI/2:-Math.PI/2);
    g.drawImage(img,-img.width/2,-img.height/2);
  }
  const t=new THREE.CanvasTexture(src);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}
function edgeMaterial(col){
  return new THREE.ShaderMaterial({transparent:true,
    uniforms:{uCol:{value:new THREE.Color(col)},uOpacity:{value:0}},
    vertexShader:`varying vec3 vNw;
      void main(){ vNw=normalize(mat3(modelMatrix)*normal);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 uCol; uniform float uOpacity; varying vec3 vNw;
      void main(){
        vec3 N=normalize(vNw);
        vec3 L=normalize(vec3(0.52,0.70,0.55)), F=normalize(vec3(-0.35,-0.18,0.92));
        float shade=0.70+0.34*max(dot(N,L),0.0)+0.14*max(dot(N,F),0.0);
        gl_FragColor=vec4(uCol*shade,uOpacity);
        #include <colorspace_fragment>
      }`});
}

/* captions under the two drives of a comparison volume, placed where the
   camera puts each drive (the hand holds the pair at 0.45 across the view) */
function placeCaps(B,az){
  const el=document.getElementById('pair-cap');
  if(!B||!B.pair||MOBILE){ el.classList.remove('on'); return; }
  const tan=Math.tan(K.fov*Math.PI/360), d=camera.position.z-az, sx=d*tan*camera.aspect;
  const f=B.flipped?-1:1;                                 // a flip carries each drive to the other side
  el.style.setProperty('--a',(1.45+f*B.pair.xA/sx)*50+'%');
  el.style.setProperty('--b',(1.45+f*B.pair.xB/sx)*50+'%');
  el.style.setProperty('--y',(1+B.ah*0.5/(d*tan))*50+'%');
  document.getElementById('cap-a').innerHTML=B.data.caps[0];
  document.getElementById('cap-b').innerHTML=B.data.caps[1];
  el.classList.add('on');
}

function buildBook(data,index){
  const rnd=mulberry(index*7919+13);
  const dev=data.dev, pl=PLATE[data.id];
  const B={data,index,flipped:false,land:!!dev.land};
  // real size: the long side is dev.mm, the short side follows the photo
  const k=MM*(dev.boost||1), long=dev.mm*k;
  const aspect=pl.front.height/pl.front.width;           // short / long for a landscape photo
  B.W=B.land? long*aspect : long/aspect;
  B.H=long;
  B.D=dev.d*k;
  B.activeRot=[K.activeRot[0],K.activeRot[1],B.land?-Math.PI/2:0];
  B._lean=K.lean+(rnd()-0.5)*0.075;
  B._yaw = K.yaw+(rnd()-0.5)*0.045;
  B._roll=(rnd()-0.5)*0.018;
  B.rest=[B._lean,B._yaw,B._roll];
  B.restTilt=MOBILE?K.mTilt:B._lean;
  B.base=[0,0,0.01];
  B.basePos=bookBase(B);
  const W=B.W, H=B.H, D=B.D;

  const gRoot=new THREE.Group(); gRoot.position.set(...B.basePos);
  const gHover=new THREE.Group(); gHover.position.set(...B.base);
  const gWob=new THREE.Group();
  const gTilt=new THREE.Group(); gTilt.rotation.set(...(MOBILE?[K.mTilt,0,0]:B.rest));
  const gScl=new THREE.Group(); gScl.scale.setScalar(0);
  gRoot.add(gHover); gHover.add(gWob); gWob.add(gTilt); gTilt.add(gScl);
  scene.add(gRoot);

  const clothMat=new THREE.MeshBasicMaterial({visible:false});   // the photos are the faces
  // the board shader with the bow and chamfer flattened: the photo carries the relief
  const mk=(tex,satin,seed,w,h)=>new THREE.ShaderMaterial({transparent:true,
    uniforms:{uTex:{value:tex},uSatin:{value:satin},uOpacity:{value:0},uSeed:{value:seed},
              uBow:{value:0},uChamf:{value:0},uER:{value:K.chamfR},
              uW:{value:w},uH:{value:h}},
    vertexShader:COVER_VS,fragmentShader:COVER_FS});
  // one physical device: a core block between its two photographs
  function device(front,backImg,w,h,d,land,o){
    const g=new THREE.Group(), edge=edgeMaterial(o.edge);
    // the core sits inside the cut-out, so its edges never show past a ragged outline
    const [ix,iy]=o.inset||[0.97,0.985];
    const sd=o.twin?clothMat:edge;                       // a kit has air between its sticks: no solid core
    const body=new THREE.Mesh(new THREE.BoxGeometry(w*ix,h*iy,d),[sd,sd,sd,sd,clothMat,clothMat]);
    const geo=new THREE.PlaneGeometry(w,h), coverTex=faceTex(front,land,false);
    const coverMat=mk(coverTex,0.8,index*7.3,w,h), backMat=mk(faceTex(backImg,land,true),0.6,index*3.1+11,w,h);
    const cover=new THREE.Mesh(geo,coverMat); cover.position.z=d/2+0.0008;
    const back=new THREE.Mesh(geo,backMat); back.position.z=-d/2-0.0008; back.rotation.y=Math.PI;
    g.add(body,cover,back);
    return {g,body,cover,back,coverMat,backMat,edge,coverTex};
  }
  const A=device(pl.front,pl.back,W,H,D,B.land,dev);
  gScl.add(A.g);
  const {body,cover,back,coverMat,backMat,edge,coverTex}=A;
  B.bodies=[body];
  B.loadBack=()=>{};
  // a comparison volume carries a second device that slides out beside the first once in the hand
  if(dev.pair){
    const p=dev.pair, pp=PLATE[data.id+'+'], pk=MM*(p.boost||1);
    const pw=p.mm*pk, ph=pw*pp.front.height/pp.front.width;      // shown as photographed, landscape
    const P=device(pp.front,pp.back,pw,ph,p.d*pk,false,p);
    P.g.scale.setScalar(0); gScl.add(P.g);
    const gap=0.16, tot=W+gap+pw;
    B.pair={g:P.g,xA:-tot/2+W/2,xB:tot/2-pw/2,mats:[P.coverMat,P.backMat,P.edge]};
    B.devA=A.g; B.aw=tot; B.ah=Math.max(H,ph); B.tPair=new Tw([0]);
    B.bodies.push(P.body);
    B.activeRot=[K.activeRot[0],0.12,0];                  // nearly square-on, so neither drive hides the other
  }

  const hit=new THREE.Mesh(new THREE.PlaneGeometry(Math.max(W*1.06,0.62),H*0.98),
    new THREE.MeshBasicMaterial({visible:false}));
  hit.position.set(B.basePos[0],B.basePos[1],B.basePos[2]-0.04);
  hit.rotation.x=MOBILE?K.mTilt:B._lean;
  hit.rotation.y=MOBILE?0:B._yaw;
  hit.userData.book=B;
  scene.add(hit);

  const wallSh=new THREE.Mesh(new THREE.PlaneGeometry(2.20*(W+0.25)/(SZW+0.25),2.70*H/SZH),
    new THREE.MeshBasicMaterial({map:SHADOW_TEX,transparent:true,opacity:0,depthWrite:false,color:0x241c12}));
  wallSh.position.set(B.basePos[0]-0.05,B.basePos[1]-0.04,K.wallZ+0.004);
  scene.add(wallSh);

  const footZ=K.bookZ+(H/2)*Math.sin(-B._lean);             // where the device meets the plank
  const csBack=footZ-D*0.5-0.045;
  const csFront=K.wallZ+K.plankDepth-0.035;
  const csDepth=csFront-csBack;
  const cs=new THREE.Mesh(new THREE.PlaneGeometry(W*1.42+0.08,csDepth),
    new THREE.MeshBasicMaterial({map:CONTACT_TEX,transparent:true,opacity:0,depthWrite:false,color:0x241a10}));
  cs.rotation.x=-Math.PI/2;
  cs.position.set(B.basePos[0],K.shelfTop[data.shelf]+0.0022,csBack+csDepth*0.5);
  scene.add(cs);
  const crease=new THREE.Mesh(new THREE.PlaneGeometry(W*1.16,0.075),
    new THREE.MeshBasicMaterial({map:CREASE_TEX,color:0x1a1208,transparent:true,opacity:0,depthWrite:false}));
  crease.position.set(B.basePos[0],K.shelfTop[data.shelf]+0.030,footZ+D*0.5+0.004);
  scene.add(crease);

  const reflMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
    uniforms:{uTex:{value:coverTex},uOpacity:{value:0}},
    vertexShader:`varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      uniform sampler2D uTex; uniform float uOpacity; varying vec2 vUv;
      float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
        p3+=dot(p3,p3.yxz+33.33);return fract((p3.x+p3.y)*p3.z);}
      void main(){
        float mappedY=mix(0.0,0.22,1.0-vUv.y);
        float edge=min(min(smoothstep(0.0,0.06,vUv.y),smoothstep(0.0,0.12,1.0-vUv.y)),
                       min(smoothstep(0.0,0.06,vUv.x),smoothstep(0.0,0.06,1.0-vUv.x)));
        float b=0.004+0.02*(1.0-edge);
        vec4 col=(texture2D(uTex,vec2(vUv.x+b,mappedY))+texture2D(uTex,vec2(vUv.x-b,mappedY))
                 +texture2D(uTex,vec2(vUv.x,mappedY+b*0.5))+texture2D(uTex,vec2(vUv.x,mappedY-b*0.5)))*0.25;
        float fade=vUv.y*vUv.y*1.7;
        float sp=hash(vUv*220.0);
        gl_FragColor=vec4(col.rgb,uOpacity*fade*(1.0-sp*0.34)*edge*col.a);
        #include <colorspace_fragment>
      }`});
  const refl=new THREE.Mesh(new THREE.PlaneGeometry(W,0.60*H/SZH),reflMat);
  refl.rotation.x=-Math.PI/2;
  refl.position.set(B.basePos[0],K.shelfTop[data.shelf]+0.0012,footZ+0.24);
  scene.add(refl);

  Object.assign(B,{gRoot,gHover,gWob,gTilt,gScl,body,cover,back,coverMat,backMat,spineMat:edge,
    clothMat,pages:edge,hit,wallSh,cs,crease,refl,reflMat,
    tHover:new Tw([...B.base]), tTilt:new Tw(MOBILE?[K.mTilt,0,0]:[...B.rest]),

const S={anim:'intro',active:null,lifted:null};
function hoverIn(B,dur){
  const d=dur===undefined?K.hoverLift:dur;
  B.tHover.start([B.base[0],B.base[1]+0.085,B.base[2]+0.075],d,easeOutQuart);
  B.tTilt.start([0,0,0],d,easeOutQuart);

}
function hoverOut(B){
  const d=K.hoverDrop;
  B.tHover.start([...B.base],d,easeSettle);
  B.tTilt.start(MOBILE?[B.restTilt,0,0]:[...B.rest],d,easeSettle,d*0.22);
  B.tRefl.start([0.34],d,easeSettle);

}
function activeZ(B){                      // close enough to fill the view beside the panel
  const camZ=camera.position.z, tan=Math.tan(K.fov*Math.PI/360);
  const w=B.aw||(B.land?B.H:B.W), h=B.ah||(B.land?B.W:B.H);
  const dv=(h*0.5)/(MOBILE?0.86:0.62)/tan;
  const dh=(w*0.5)/(MOBILE?0.86:0.44)/(tan*camera.aspect);
  return camZ-Math.max(dv,dh);
}
function toActive(B){
  S.anim='animatingForward'; hoverIn(B);

  const ay = MOBILE ? mobileTargetY() : K.boxCY-0.02;
  const az=activeZ(B);
  const ax=MOBILE?0:0.45*(camera.position.z-az)*Math.tan(K.fov*Math.PI/360)*camera.aspect;
  B.tActiveP.start([ax,ay,az],K.activeDuration,activeEase);
  B._az=az;
  if(B.pair) B.tPair.start([1],K.activeDuration,activeEase);   // the second drive slides out of the first
  placeCaps(B,az);

  if(B.data.dash&&!MOBILE) B.tScale.start([0],K.activeDuration*0.7,easeOutQuart,K.activeDuration*0.15);  // the dashboard takes its place
  B.gRoot.renderOrder=10; setLayer(B,LAY_FG);
  setTimeout(()=>{ if(S.active===B) S.anim='active'; },K.activeDuration);
}
function toInactive(B){
  S.anim='animatingBackward'; B.flipped=false;
  dashEl.classList.remove('on');
  placeCaps(null);
  if(B.pair) B.tPair.start([0],K.activeDuration*0.8,easeSettle);
  if(B.data.dash) B.tScale.start([1],K.activeDuration,easeOutQuart);
  B.tSeat.start([1],K.activeDuration*0.62,easeSettle,K.activeDuration*0.38);
  B.tHover.start([B.base[0],B.base[1]+0.06,B.base[2]],K.activeDuration,easeOutQuart);
  B.tActiveP.start([...B.basePos],K.activeDuration,activeEase);
  B.tActiveR.start([0,0,0],K.activeDuration,activeEase);
  setTimeout(()=>hoverOut(B),K.activeDuration);
  setTimeout(()=>{ S.anim='inactive'; setLayer(B,LAY_BG);

                   if(S.lifted===B)S.lifted=null; },K.activeDuration+20);
}
function setLayer(B,l){ B.gRoot.traverse(o=>o.layers.set(l)); }
function setActive(B){
  if(S.anim==='intro'||S.anim==='animatingForward'||S.anim==='animatingBackward')return;
  if(S.active===B)return;
  if(S.active){toInactive(S.active);S.active=null;detailEl.classList.remove('on');document.body.classList.remove('reading');WASH.target=0;return;}
  S.active=B;S.lifted=B;toActive(B);

function flipActive(){
  const B=S.active; if(!B||S.anim!=='active')return;
  B.flipped=!B.flipped; B.loadBack();

/* ════════════════════════════════════════════════════════════════════════
   5 · CAMERA (orbits toward the pointer) + BLUR COMPOSITE
   ════════════════════════════════════════════════════════════════════════ */
let VW=1,VH=1,DIST=12;
const ORB={tx:0,ty:0,x:0,y:0};
const TGT=new THREE.Vector3();
function mobileTargetY(){
  const tan=Math.tan(K.fov*Math.PI/360);
  const D=DIST-K.mZ0;
  const stackTop=K.mY+(BOOKS.length-1)*K.mStepY+SZH*0.5*Math.cos(K.mTilt);
  return Math.max(K.mY+K.mDrop*D*tan, stackTop-0.80*D*tan);
}
function applyCamera(){
  const damp=MOBILE?0:(S.active?0.42:1);
  const az=ORB.x*K.orbitAz*damp;
  const el=0.0025-ORB.y*K.orbitEl*damp;
  TGT.set(0, MOBILE?mobileTargetY():K.boxCY, 0);
  camera.position.set(
    TGT.x+Math.sin(az)*Math.cos(el)*DIST,
    TGT.y+Math.sin(el)*DIST,
    TGT.z+Math.cos(az)*Math.cos(el)*DIST);
  camera.lookAt(TGT);
}
function frameCamera(){
  const aspect=VW/VH, tan=Math.tan(K.fov*Math.PI/360);
  camera.aspect=aspect;
  if(MOBILE){
    const a=clamp(aspect,0.40,0.95);
    DIST=(SZW*0.5)/(K.mFill*tan*a)+K.mZ0;
    camera.near=Math.max(DIST-9,0.1); camera.far=DIST+26;
  } else {
    const distV=K.boxY/(2*tan), distH=K.boxX/(2*tan*aspect);
    let d=K.offset*Math.max(distV,distH);
    const projW=VW*K.boxX/(2*d*tan*aspect);
    if(projW>K.maxWidthPx) d=VW*K.boxX/(2*K.maxWidthPx*tan*aspect);
    DIST=d;
    const maxDim=Math.max(K.boxX,K.boxY);
    camera.near=Math.max(DIST-maxDim*2-2,0.1); camera.far=DIST+maxDim*2+16;
  }
  applyCamera();
  camera.updateProjectionMatrix();
}

const rt=new THREE.WebGLRenderTarget(2,2,{
  type:THREE.HalfFloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,
  depthBuffer:true,stencilBuffer:false,samples:4});
const NOISE_N=256, noiseData=new Uint8Array(NOISE_N*NOISE_N*4);
{ const r=mulberry(4242);
  for(let i=0;i<NOISE_N*NOISE_N;i++){noiseData[i*4]=(r()*255)|0;noiseData[i*4+1]=(r()*255)|0;
    noiseData[i*4+2]=(r()*255)|0;noiseData[i*4+3]=255;} }
const noiseTex=new THREE.DataTexture(noiseData,NOISE_N,NOISE_N);
noiseTex.wrapS=noiseTex.wrapT=THREE.RepeatWrapping;
noiseTex.minFilter=noiseTex.magFilter=THREE.LinearFilter;noiseTex.needsUpdate=true;

const passMat=new THREE.ShaderMaterial({
  depthTest:false,depthWrite:false,
  uniforms:{backgroundTexture:{value:rt.texture},noiseTexture:{value:noiseTex},
    noiseScale:{value:6},intensity:{value:0},ignoreBlur:{value:true},
    samples:{value:30},resolution:{value:new THREE.Vector2(1,1)}},
  vertexShader:`varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}`,
  fragmentShader:`
    uniform sampler2D backgroundTexture; uniform sampler2D noiseTexture;
    uniform float noiseScale; uniform float intensity; uniform bool ignoreBlur;
    uniform float samples; uniform vec2 resolution;
    varying vec2 vUv;
    const float pi=3.14159265359;
    const float goldenAngle=pi*(3.0-sqrt(5.0));
    vec4 goldenBlur(vec2 uv,sampler2D tex){
      float noise=texture2D(noiseTexture,uv*noiseScale).r;
      float angle=pi+(noise-0.5)*2.0*pi*2.0;
      vec2 polar=vec2(cos(angle),sin(angle));
      vec4 sum=vec4(0.0);
      vec2 a=vec2(1024.)*vec2(1.,resolution.x/resolution.y);
      for(int i=1;i<=32;i++){
        if(float(i)>samples)break;
        float r=intensity*sqrt(float(i)/samples);
        float theta=float(i)*goldenAngle;
        vec2 off=vec2(polar.x*cos(theta)-polar.y*sin(theta),
                      polar.y*cos(theta)+polar.x*sin(theta));
        sum+=texture2D(tex,uv+(off*r/a));
      }
      return sum/samples;
    }
    void main(){
      gl_FragColor=texture2D(backgroundTexture,vUv);
      if(!ignoreBlur) gl_FragColor=goldenBlur(vUv,backgroundTexture);
      gl_FragColor.a=1.0;
      #include <colorspace_fragment>
    }`});
const quadGeo=new THREE.BufferGeometry();
quadGeo.setAttribute('position',new THREE.Float32BufferAttribute([-1,-1,0,3,-1,0,-1,3,0],3));
quadGeo.setAttribute('uv',new THREE.Float32BufferAttribute([0,0,2,0,0,2],2));
const quad=new THREE.Mesh(quadGeo,passMat); quad.frustumCulled=false;
const quadScene=new THREE.Scene(); quadScene.add(quad);
const quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blurTw={i:new Tw([0]),n:new Tw([1])};

function resize(){
  VW=Math.max(1,innerWidth); VH=Math.max(1,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));   // browser zoom changes it: re-read or the canvas goes soft
  renderer.setSize(VW,VH,false);
  const pr=renderer.getPixelRatio();

   6 · UI

const dMeta=document.getElementById('detail-meta'), dTitle=document.getElementById('detail-title');

const washEl=document.getElementById('wash');
const wctx=washEl.getContext('2d');
const WASH={t:0,target:0,w:1,h:1,sheet:null,travel:1,dirty:true};

function hash1(i){ let x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function vnoise1(t,seed){
  const i=Math.floor(t), f=t-i, u=f*f*(3-2*f);
  return lerp(hash1(i+seed*97.3), hash1(i+1+seed*97.3), u);
}
function hash2(x,y){ let v=Math.sin(x*12.9898+y*78.233)*43758.5453; return v-Math.floor(v); }

/* the torn band: solid on the left, breaking into fibres on the right */
function buildTearBand(TW,h){
  const oct=[[1/430,44],[1/170,21],[1/74,10.5],[1/31,5.0],[1/13,2.4],[1/6,1.2]];
  const edge=new Float32Array(h);
  for(let y=0;y<h;y++){
    let e=TW*0.42;
    for(let k=0;k<oct.length;k++) e+=(vnoise1(y*oct[k][0],k+1)-0.5)*2*oct[k][1];
    edge[y]=e;
  }
  const a=new Float32Array(TW*h);
  for(let y=0;y<h;y++){
    const e=edge[y];
    const fib=5+17*vnoise1(y/8.5,11);          // fibre length varies down the tear
    for(let x=0;x<TW;x++){
      const t=(x-e)/fib;
      let v;
      if(t<=0) v=1;
      else if(t>=1.35) v=0;
      else {
        // break the falloff up so it reads as fibres rather than a soft cut
        const n=hash2(Math.floor(x*0.9),Math.floor(y*0.75))*0.62
               +hash2(Math.floor(x*2.4)+37,Math.floor(y*2.1)+11)*0.38;
        v=clamp(1.18-t-(n-0.5)*0.95,0,1);
        v=v*v*(3-2*v);
      }
      a[y*TW+x]=v;
    }
  }
  return a;
}
function tintBand(a,TW,h,r,g0,b0,edgeDark){
  const c=C(TW,h), g=c.getContext('2d');
  const img=g.createImageData(TW,h), d=img.data;
  for(let i=0;i<TW*h;i++){
    const v=a[i];
    let k=1;
    if(edgeDark&&v>0.02&&v<0.97) k=0.86+0.14*v;   // compressed fibres at the tear
    d[i*4]=r*k; d[i*4+1]=g0*k; d[i*4+2]=b0*k;
    d[i*4+3]=v*255;
  }
  g.putImageData(img,0,0);
  return c;
}
function buildSheet(){
  const w=WASH.w,h=WASH.h;
  if(w<8||h<8) return;
  const TW=Math.min(210,Math.round(w*0.34));
  const X0=Math.max(0,w-TW-46);
  const a=buildTearBand(TW,h);
  const paper=tintBand(a,TW,h,219,202,175,true);
  const dark =tintBand(a,TW,h,86,68,46,false);
  const cv=C(w,h), g=cv.getContext('2d');
  // the sheet casts a soft shadow onto the scene behind it
  const BL=40;                       // the sheet bleeds past the left edge of the canvas
  g.save(); g.globalAlpha=0.34; g.filter=`blur(${Math.round(h*0.020)}px)`;
  g.fillStyle='#56432e'; g.fillRect(-BL,0,X0+16+BL,h);
  g.drawImage(dark,X0+16,0);
  g.restore();
  // the sheet itself
  const pg=g.createLinearGradient(0,0,w,0);
  pg.addColorStop(0,'rgb(222,206,180)');
  pg.addColorStop(0.72,'rgb(219,202,175)');
  pg.addColorStop(1,'rgb(213,195,167)');
  g.fillStyle=pg; g.fillRect(-BL,0,X0+1+BL,h);
  g.drawImage(paper,X0,0);
  // fibre grain, only where there is paper
  g.globalCompositeOperation='source-atop';
  const r=mulberry(913);
  for(let i=0;i<2600;i++){
    const x=r()*w, y=r()*h, l=2+r()*26, ang=(r()-0.5)*0.5;
    g.strokeStyle=r()<0.5?`rgba(255,250,240,${0.02+r()*0.05})`:`rgba(120,98,70,${0.02+r()*0.05})`;
    g.lineWidth=r()<0.85?1:2;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(ang)*l,y+Math.sin(ang)*l); g.stroke();
  }
  g.fillStyle='rgba(255,252,244,0.05)';
  g.fillRect(-BL,0,w+BL,h*0.5);
  g.globalCompositeOperation='source-over';
  WASH.sheet=cv; WASH.travel=X0+TW+60;
}
function washResize(){
  const w=Math.max(1,washEl.clientWidth), h=Math.max(1,washEl.clientHeight);
  washEl.width=w; washEl.height=h; WASH.w=w; WASH.h=h;
  buildSheet(); WASH.dirty=true;
}
function drawWash(){
  const w=WASH.w,h=WASH.h,t=WASH.t;
  wctx.clearRect(0,0,w,h);
  if(t<=0.002||!WASH.sheet) return;
  wctx.drawImage(WASH.sheet,-(1-t)*WASH.travel,0);
}

/* ---- pointer ---- */
const ray=new THREE.Raycaster();
ray.layers.enable(LAY_BG); ray.layers.enable(LAY_FG);
const ptr=new THREE.Vector2();
const DRAG={on:false,moved:0,lx:0,ly:0,rx:0,ry:0};
function dragReset(){DRAG.on=false;DRAG.moved=0;DRAG.rx=0;DRAG.ry=0;}
addEventListener('pointermove',e=>{
  if(e.target.closest&&e.target.closest('.chat'))return;
  ORB.tx=(e.clientX/VW-0.5)*2; ORB.ty=(e.clientY/VH-0.5)*2;
  hintEl.style.transform=`translate(${e.clientX+12}px,${e.clientY+12}px)`;
  if(S.anim==='intro'||MOBILE)return;
  ptr.x=(e.clientX/VW)*2-1; ptr.y=-(e.clientY/VH)*2+1;
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(books.map(b=>b.hit),false);
  const B=hits.length?hits[0].object.userData.book:null;
  if(S.active){
    if(DRAG.on){                                   // turning the volume in the hand
      const dx=e.clientX-DRAG.lx, dy=e.clientY-DRAG.ly;
      DRAG.lx=e.clientX; DRAG.ly=e.clientY;
      DRAG.moved+=Math.abs(dx)+Math.abs(dy);
      DRAG.ry+=dx*0.0090;
      DRAG.rx=clamp(DRAG.rx+dy*0.0062,-0.62,0.62);
      S.active.sWob.start([DRAG.rx,DRAG.ry,0]);
      document.body.style.cursor='grabbing';
      return;
    }
    if(B===S.active&&S.anim==='active'){
      if(!REDUCED&&hits[0].uv){                    // a light parallax when the hand is off
        const uv=hits[0].uv;
        S.active.sWob.start([DRAG.rx+Math.PI/46*(uv.y-.5)*2*(S.active.flipped?-1:1),
                             DRAG.ry+Math.PI/36*((S.active.flipped?1-uv.x:uv.x)-.5)*2,0]);
      }
      hintEl.textContent='Kéo để xoay'; hintEl.classList.add('on'); document.body.style.cursor='grab';
    } else { hintEl.classList.remove('on'); document.body.style.cursor='default';
             S.active.sWob.start([DRAG.rx,DRAG.ry,0]); }
    return;
  }
  if(S.anim!=='inactive')return;
  setLifted(B);
  document.body.style.cursor=B?'pointer':'default';
  if(B) hintEl.textContent=B.data.title;            // the shelf carries no titles, so name what is under the pointer
  hintEl.classList.toggle('on',!!B);
  if(B&&hits[0].uv&&!REDUCED){
    const uv=hits[0].uv;
    B.sWob.start([Math.PI/50*(uv.y-.5)*2, Math.PI/40*(uv.x-.5)*2, 0]);
  }
});
addEventListener('pointerleave',()=>{ ORB.tx=0;ORB.ty=0;
  if(!MOBILE&&!S.active&&S.anim==='inactive')setLifted(null); });
addEventListener('blur',()=>{ ORB.tx=0;ORB.ty=0; });
addEventListener('pointerdown',e=>{
  if(e.target.closest('header')||e.target.closest('footer')||
     e.target.closest('.detail')||e.target.closest('.mbar')||e.target.closest('.menu')||
     e.target.closest('.dash')||e.target.closest('.chat'))return;
  ptr.x=(e.clientX/VW)*2-1; ptr.y=-(e.clientY/VH)*2+1;
  ray.setFromCamera(ptr,camera);
  if(S.active){
    const h=ray.intersectObjects(S.active.bodies,false);
    if(h.length){
      DRAG.on=true; DRAG.moved=0; DRAG.lx=e.clientX; DRAG.ly=e.clientY;
      document.body.style.cursor='grabbing';
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    } else clearActive();
    return;
  }
  const hits=ray.intersectObjects(books.map(b=>b.hit),false);
  if(hits.length) setActive(MOBILE?books[M.index]:hits[0].object.userData.book);
});
addEventListener('pointerup',e=>{
  if(!DRAG.on)return;
  DRAG.on=false;
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  document.body.style.cursor='grab';
  if(DRAG.moved<10) flipActive();               // a tap still turns the volume over
});
addEventListener('pointercancel',()=>{ DRAG.on=false; });
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;   // typing a question must not turn the volumes
  if(e.key==='Escape'&&S.active)clearActive();
  if((e.key===' '||e.code==='Space')&&S.active){e.preventDefault();flipActive();}
  // arrows and presenter clickers (PageUp/PageDown) walk the talk volume by volume
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();stepVolume(1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();stepVolume(-1);}
});
function stepVolume(dir){
  if(S.anim==='intro'||S.anim==='animatingForward'||S.anim==='animatingBackward')return;
  const cur=S.active?S.active.index:(dir>0?-1:BOOKS.length);
  const i=clamp(cur+dir,0,BOOKS.length-1);
  if(S.active&&i===cur)return;
  if(MOBILE)M.target=i;
  if(S.active){clearActive();setTimeout(()=>setActive(books[i]),K.activeDuration+40);}
  else setActive(books[i]);
}

/* ════════════════════════════════════════════════════════════════════════
   7 · MODE, INTRO, RENDER LOOP
   ════════════════════════════════════════════════════════════════════════ */
function applyMode(){
  document.body.classList.toggle('mobile',MOBILE);
  furniture.visible=!MOBILE;
  wall.visible=true;
  for(const B of books){
    B.basePos=bookBase(B);
    B.restTilt=MOBILE?K.mTilt:B._lean;
    if(B!==S.active){
      B.tActiveP.set([...B.basePos]);
      B.tTilt.set(MOBILE?[K.mTilt,0,0]:[...B.rest]);
      B.tHover.set([...B.base]);
    }
    B.hit.position.set(B.basePos[0],B.basePos[1],B.basePos[2]-0.04);
    B.hit.rotation.x=MOBILE?K.mTilt:B._lean; B.hit.rotation.y=MOBILE?0:B._yaw;
    B.wallSh.visible=!MOBILE; B.cs.visible=!MOBILE; B.crease.visible=!MOBILE; B.refl.visible=!MOBILE;
    B.gRoot.renderOrder=MOBILE?100-B.index:0;
  }
  if(MOBILE)setMobileIndex(M.index,true);
  frameCamera();
}
MOBILE_Q.addEventListener('change',e=>{MOBILE=e.matches;applyMode();});

const wallFade=new Tw([0]);
function revealChrome(){
  const step=REDUCED?0:1;
  for(const el of document.querySelectorAll('.rise')){
    el.style.setProperty('--d',(+el.dataset.d||0)*step+'ms');
  }
  // one reflow so the delays are in place before the class that plays them
  void document.body.offsetHeight;
  for(const el of document.querySelectorAll('.rise')) el.classList.add('in');
}
function startIntro(){
  // the volumes are already shelved — they only fade up, no tipping or settling
  S.anim='intro';
  wallFade.start([1],K.introWallFade,easeOutQuart);
  books.forEach((B,i)=>{
    B.tScale.set([1]);
    B.tHover.set([...B.base]);
    B.tTilt.set(MOBILE?[B.restTilt,0,0]:[...B.rest]);
    B.tFade.set([0]);
    B.tFade.start([1],K.introFade,easeOutQuart,i*K.introStagger);
  });
  setTimeout(()=>{ if(S.anim==='intro')S.anim='inactive'; },
             K.introWallFade+books.length*K.introStagger);
}


let last=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  NOW=now; const dt=Math.min((now-last)/1000,0.05); last=now;

  // during the intro the camera snaps to the pointer instead of easing, so the
  // shelf never swings into place on load
  {
    const tg=WASH.target, k2=Math.min(1,dt*(tg>WASH.t?5.2:8.5));
    if(Math.abs(tg-WASH.t)>0.0009||WASH.dirty){ WASH.t+=(tg-WASH.t)*k2; WASH.dirty=false; drawWash(); }
  }
  const k=(S.anim==='intro')?1:Math.min(1,dt*3.4);
  ORB.x+=(ORB.tx-ORB.x)*k; ORB.y+=(ORB.ty-ORB.y)*k;
  applyCamera();

  wallFade.update();
  const wf=wallFade.v[0];
  wallMat.uniforms.uOpacity.value=wf; oakH.uniforms.uOpacity.value=wf; oakV.uniforms.uOpacity.value=wf;

  if(MOBILE){
    if(!S.active) M.scroll+=(M.target-M.scroll)*Math.min(1,dt*9);
    setMobileIndex(Math.round(M.scroll));
    for(const B of books){
      B.basePos=mPos(B.index,M.scroll);
      if(B===S.active||S.anim==='animatingBackward')continue;
      B.tActiveP.v[0]=B.basePos[0];B.tActiveP.v[1]=B.basePos[1];B.tActiveP.v[2]=B.basePos[2];
      B.tActiveP.d=0;
      const u=clamp(M.scroll-B.index,0,1.6);
      B.tTilt.v[0]=lerp(K.mTilt,K.mFlat,smooth(Math.min(u,1))); B.tTilt.d=0;
      B.mFade=1-smooth(clamp((u-0.28)/0.5,0,1));
      B.gRoot.visible=B.mFade>0.01 && B.index-M.scroll<9.5;
    }
  }

  for(const B of books){
    B.tHover.update();B.tTilt.update();B.tActiveP.update();B.tActiveR.update();
    B.tScale.update();B.tRefl.update();B.tFade.update();B.tSeat.update();B.sWob.update(dt);
    B.gHover.position.set(B.tHover.v[0],B.tHover.v[1],B.tHover.v[2]);
    B.gTilt.rotation.set(B.tTilt.v[0],B.tTilt.v[1],B.tTilt.v[2]);
    B.gWob.rotation.set(B.sWob.v[0],B.sWob.v[1],B.sWob.v[2]);
    B.gRoot.position.set(B.tActiveP.v[0],B.tActiveP.v[1],B.tActiveP.v[2]);
    B.gRoot.rotation.set(B.tActiveR.v[0],B.tActiveR.v[1],0);
    B.gScl.rotation.z=B.tActiveR.v[2];                      // turn landscape inside the hand, so dragging stays level
    B.gScl.scale.setScalar(B.tScale.v[0]);
    const op=B.tFade.v[0]*wf*(MOBILE&&B.mFade!==undefined&&B!==S.active?B.mFade:1);
    B.clothMat.opacity=op; B.spineMat.uniforms.uOpacity.value=op;
    B.pages.uniforms.uOpacity.value=op;
    B.coverMat.uniforms.uOpacity.value=op;
    B.backMat.uniforms.uOpacity.value=op;
    if(B.pair){
      for(const m of B.pair.mats) m.uniforms.uOpacity.value=op;
      B.tPair.update(); const k=B.tPair.v[0];
      B.devA.position.x=B.pair.xA*k; B.pair.g.position.x=B.pair.xB*k; B.pair.g.scale.setScalar(k);
    }
    if(!MOBILE){
      const lift=B.tHover.v[1], away=clamp((B.tHover.v[2]-B.base[2])/0.075,0,1);
      B.wallSh.position.x=B.basePos[0]-0.09-away*0.05;
      B.wallSh.position.y=B.basePos[1]+lift-0.04+away*0.02;
      B.wallSh.scale.setScalar((1+away*0.13)*(B.tScale.v[0]||0.0001));
      const seat=B.tSeat.v[0];                                   // 1 on the shelf, 0 in the hand
      B.wallSh.material.opacity=(0.50-away*0.15)*op*seat;
      B.cs.material.opacity=(0.92*(1-away*0.55))*op*seat;
      B.crease.material.opacity=(0.55*(1-away))*op*seat;
      B.reflMat.uniforms.uOpacity.value=B.tRefl.v[0]*op*seat;
      B.refl.position.z=K.bookZ+(B.H/2)*Math.sin(-B._lean)+0.24+B.tHover.v[2]*2;
    }
  }

  const wantBlur=(S.anim==='animatingForward'||S.anim==='active');
  if(blurTw._w!==wantBlur){blurTw._w=wantBlur;
    blurTw.i.start([wantBlur?16:0],460,t=>t,100);
    blurTw.n.start([wantBlur?6:1],400,t=>t,100);}
  blurTw.i.update();blurTw.n.update();

  const act=(S.anim==='animatingForward'||S.anim==='active'||S.anim==='animatingBackward');
  camera.layers.set(LAY_BG);
  renderer.setRenderTarget(rt);
  renderer.clear(true,true,false);
  renderer.render(scene,camera);
  renderer.setRenderTarget(null);
  passMat.uniforms.ignoreBlur.value=!act;
  passMat.uniforms.intensity.value=blurTw.i.v[0];
  passMat.uniforms.noiseScale.value=blurTw.n.v[0];
  renderer.clear(true,true,false);
  renderer.render(quadScene,quadCam);
  if(act){
    renderer.clearDepth();
    camera.layers.set(LAY_FG);
    renderer.render(scene,camera);
  }
}

/* ════════════════════════════════════════════════════════════════════════
   8 · HỎI ĐÁP — ask Claude about the components, on the viewer's own account
   ════════════════════════════════════════════════════════════════════════ */
const chatEl=document.getElementById('chat'), chatLog=document.getElementById('chat-log'),
      chatForm=document.getElementById('chat-form'), chatInput=document.getElementById('chat-input'),
      chatOpen=document.getElementById('chat-open'), chatChips=document.getElementById('chat-chips');
// Claude remembers nothing between calls: every call carries the rules, the talk and the chat so far
const chatRules=()=>`Bạn là trợ lý hỏi đáp trong bài thuyết trình môn Tin học về linh kiện máy tính (RAM, ổ cứng HDD/SSD và các linh kiện khác như CPU, GPU, bo mạch chủ, nguồn).
Trả lời bằng tiếng Việt, đúng kiến thức, dễ hiểu với sinh viên, thường 3–6 câu; khi phù hợp hãy giải thích "tại sao". Chỉ dùng câu văn thường, **in đậm** và gạch đầu dòng "- "; không dùng tiêu đề hay bảng.
Nếu câu hỏi không liên quan đến máy tính, trả lời ngắn rằng bạn chỉ hỏi đáp về linh kiện máy tính.

Nội dung bài thuyết trình:
${BOOKS.map(b=>`Phần ${b.vol} – ${b.title}: ${b.blurb} ${b.pts.join(' ')} ${b.back.join(' ')}`).join('\n')}${
  S.active?`\n\nNgười xem đang mở Phần ${S.active.data.vol} (${S.active.data.title}).`:''}`;
const turns=[]; let askFn=null, askCtl=null;
function inline(el,s){                   // **bold**, everything else as plain text
  for(const part of s.split(/(\*\*[^*]+\*\*)/)){
    if(/^\*\*[^*]+\*\*$/.test(part)){const b=document.createElement('strong');b.textContent=part.slice(2,-2);el.appendChild(b);}
    else if(part) el.appendChild(document.createTextNode(part));
  }
}
function setMsg(el,text){
  el.replaceChildren(); let ul=null;
  for(const line of text.split('\n')){
    const m=line.match(/^\s*[-•*]\s+(.*)/);
    if(m){ if(!ul){ul=document.createElement('ul');el.appendChild(ul);}
           const li=document.createElement('li');inline(li,m[1]);ul.appendChild(li);continue; }
    ul=null; if(!line.trim())continue;
    const p=document.createElement('p');inline(p,line.replace(/^#+\s*/,''));el.appendChild(p);
  }
}
function bubble(kind,text){
  const d=document.createElement('div'); d.className='msg '+kind;
  if(text) setMsg(d,text);
  chatLog.appendChild(d); chatLog.scrollTop=chatLog.scrollHeight; return d;
}
const ASK_ERR={rate_limited:'Đang hỏi quá nhiều. Đợi một lát rồi thử lại.',
  session_expired:'Phiên đăng nhập Claude đã hết hạn. Hãy đăng nhập lại.',
  refused:'Claude không trả lời câu này. Thử hỏi theo cách khác.',
  empty_completion:'Chưa có câu trả lời. Thử hỏi ngắn gọn hơn.',
  prompt_too_large:'Cuộc trò chuyện đã quá dài. Tải lại trang để bắt đầu lại.'};
const ASK_OFF=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
async function ask(q){
  q=q.trim(); if(!q||askCtl||!askFn) return;
  chatChips.hidden=true;
  bubble('me',q); turns.push({role:'user',content:q});
  const out=bubble('ai wait'); out.textContent='Đang suy nghĩ…';
  askCtl=new AbortController(); chatEl.classList.add('busy');
  try{
    const {text,truncated}=await askFn([{role:'user',content:chatRules()},...turns.slice(-12)],{
      cache:false, signal:askCtl.signal,
      onText:({text})=>{out.classList.remove('wait');setMsg(out,text);chatLog.scrollTop=chatLog.scrollHeight;}});
    turns.push({role:'assistant',content:text});
    if(truncated) bubble('note','Câu trả lời bị cắt ngắn. Hãy hỏi hẹp hơn.');
  }catch(e){
    out.classList.remove('wait');
    if(e.text){ setMsg(out,e.text); turns.push({role:'assistant',content:e.text}); } else out.remove();
    if(ASK_OFF.includes(e.code)){
      bubble('note','Trang chưa được phép dùng Claude, nên phần hỏi đáp tạm tắt.');
      chatInput.disabled=true; askFn=null;
    } else if(e.code!=='cancelled') bubble('note',ASK_ERR[e.code]||'Mất kết nối với Claude. Thử lại sau.');
  }finally{ askCtl=null; chatEl.classList.remove('busy'); }
}
chatOpen.addEventListener('click',()=>{ chatEl.hidden=!chatEl.hidden; if(!chatEl.hidden) chatInput.focus(); });
document.getElementById('chat-close').addEventListener('click',()=>{ chatEl.hidden=true; });
document.getElementById('chat-stop').addEventListener('click',()=>askCtl?.abort());
chatForm.addEventListener('submit',e=>{ e.preventDefault(); const q=chatInput.value; chatInput.value=''; ask(q); });
chatInput.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); chatForm.requestSubmit(); }
  if(e.key==='Escape') chatEl.hidden=true; });
chatChips.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) ask(b.textContent); });
// the button only appears where this view can reach Claude (a published artifact), never in a saved copy
window.claude?.use?.('sample').then(fn=>{ if(fn){ askFn=fn; chatOpen.hidden=false; } }).catch(()=>{});

/* ---- boot ---- */
const loader=document.getElementById('loader'), barfill=document.getElementById('barfill');
const setProgress=p=>barfill.style.transform=`scaleX(${p})`;
setProgress(0.06);
const frame=()=>new Promise(r=>{let done=false;const go=()=>{if(!done){done=true;r();}};
  requestAnimationFrame(go);setTimeout(go,34);});

(async function boot(){
  // the Vietnamese subsets only load on demand
  const VI='Ộ ữ ấ ầ ể đ';
  try{ await Promise.race([
    Promise.all(['500 40px "EB Garamond"','400 40px "EB Garamond"','400 20px Inter','500 20px Inter']
      .map(f=>document.fonts.load(f,VI))).then(()=>document.fonts.ready),
    new Promise(r=>setTimeout(r,2200))]); }catch(e){}
  setProgress(0.10);
  await loadPlates();
  setProgress(0.16);
  if(!document.hidden) await frame();
  for(let i=0;i<BOOKS.length;i++){
    books.push(buildBook(BOOKS[i],i));
    setProgress(0.16+0.80*(i+1)/BOOKS.length);
    if(!document.hidden) await frame();
  }
  applyMode();
  resize(); washResize();
  setProgress(1);
  requestAnimationFrame(tick);
  await frame(); await frame();
  loader.classList.add('gone');
  canvas.classList.add('on');
  revealChrome();
  document.querySelector('footer').classList.add('on');
  mbar.classList.add('on');
  startIntro();
})();
</script>
