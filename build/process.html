<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#4a7;font:12px sans-serif">
<div id="log"></div><div id="view" style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script>
// name: raw file, crop: [x0,y0,x1,y1] normalized, key: flood-fill the background, rot: quarter turns CW
const JOBS = [
  {out:'gskill', src:'gskill.jpg', key:true, max:1920},
  {out:'ddr4',   src:'ddr4.png',  key:true, max:1920},
  {out:'ddr5f',  src:'ddr5f.jpg', key:true, max:1920},
  {out:'ddr5b',  src:'ddr5b.jpg', key:true, max:1920},
  {out:'ddr3f',  src:'ddr3.jpg',  key:true, crop:[0,0,1,.5], max:1920},
  {out:'ddr3b',  src:'ddr3.jpg',  key:true, crop:[0,.5,1,1], max:1920},
  {out:'sodf',   src:'sodf.jpg',  key:true, crop:[.05,.25,.95,.72], max:1920},
  {out:'sodb',   src:'sodb.jpg',  key:true, max:1920},
  {out:'ssdf',   src:'ssdf.png'},
  {out:'ssdb',   src:'ssdb.png'},
  {out:'hddf',   src:'hddf.jpg',  key:true, crop:[0,0,.5,1], trim:[.236,0,.978,1]},
  {out:'hddb',   src:'hddb.jpg',  key:true, crop:[0,0,.5,1], trim:[0,0,.833,1], rot:2},
  {out:'m2f',    src:'m2f.jpg',   key:true, max:1920},
  {out:'m2b',    src:'m2b.jpg',   key:true, max:1920},
  {out:'tosf',   src:'tosf.jpg',  key:true, solid:true, max:1100},
  {out:'tosb',   src:'tosb.jpg',  key:true, solid:true, max:1100},
  {out:'exosf',  src:'exosf.png', key:true},
  {out:'exosb',  src:'exosb.png', key:true, rot:1, trim:[.075,0,1,1]},
];
const P = new URLSearchParams(location.search);
const TOL = +(P.get('tol')||14), CAP = +(P.get('cap')||70);
const only = P.get('only');
const load = s => new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src='raw/'+s;});

function keyOut(d,w,h){
  // flood the background in from the border: a pixel joins if it is close to the
  // neighbour that reached it and not too far from the border colour
  const N=w*h, bg=new Uint8Array(N), q=new Int32Array(N); let qh=0,qt=0;
  let rs=0,gs=0,bs=0,n=0;
  for(let x=0;x<w;x++)for(const y of [0,h-1]){const o=(y*w+x)*4;rs+=d[o];gs+=d[o+1];bs+=d[o+2];n++;}
  const R=rs/n,G=gs/n,B=bs/n;
  const far=o=>Math.abs(d[o]-R)+Math.abs(d[o+1]-G)+Math.abs(d[o+2]-B);
  const push=(i)=>{if(!bg[i]&&d[i*4+3]>0&&far(i*4)<CAP*3){bg[i]=1;q[qt++]=i;}};
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x);}
  for(let y=0;y<h;y++){push(y*w);push(y*w+w-1);}
  while(qh<qt){
    const i=q[qh++],x=i%w,y=(i/w)|0,o=i*4;
    for(const j of [x>0?i-1:-1,x<w-1?i+1:-1,y>0?i-w:-1,y<h-1?i+w:-1]){
      if(j<0||bg[j])continue;const p=j*4;
      if(Math.abs(d[p]-d[o])+Math.abs(d[p+1]-d[o+1])+Math.abs(d[p+2]-d[o+2])<TOL*3&&far(p)<CAP*3){bg[j]=1;q[qt++]=j;}
    }
  }
  for(let i=0;i<N;i++) if(bg[i]) d[i*4+3]=0;
}
function feather(d,w,h){       // one pass of 3x3 box blur on alpha softens the cut
  const a=new Uint8Array(w*h);for(let i=0;i<w*h;i++)a[i]=d[i*4+3];
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let s=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)s+=a[(y+dy)*w+x+dx];
    d[(y*w+x)*4+3]=Math.min(a[y*w+x],s/9*1.4);}
}
async function run(job){
  const im=await load(job.src);
  const [x0,y0,x1,y1]=job.crop||[0,0,1,1];
  const sw=Math.round(im.naturalWidth*(x1-x0)), sh=Math.round(im.naturalHeight*(y1-y0));
  let c=document.createElement('canvas');c.width=sw;c.height=sh;
  let g=c.getContext('2d',{willReadFrequently:true});
  g.drawImage(im,im.naturalWidth*x0,im.naturalHeight*y0,sw,sh,0,0,sw,sh);
  const img=g.getImageData(0,0,sw,sh);
  if(job.key) keyOut(img.data,sw,sh);
  if(job.solid){            // a box-shaped device has no holes: refill anything between its row and column extents
    const D=img.data, op=i=>D[i*4+3]>128, rl=new Int32Array(sh).fill(sw), rr=new Int32Array(sh).fill(-1),
          ct=new Int32Array(sw).fill(sh), cb=new Int32Array(sw).fill(-1);
    for(let y=0;y<sh;y++)for(let x=0;x<sw;x++)if(op(y*sw+x)){rl[y]=Math.min(rl[y],x);rr[y]=x;ct[x]=Math.min(ct[x],y);cb[x]=y;}
    for(let y=0;y<sh;y++)for(let x=rl[y];x<=rr[y];x++)if(y>=ct[x]&&y<=cb[x])D[(y*sw+x)*4+3]=255;
  }
  // drop speckles: keep only rows/cols with enough solid pixels for the bbox
  let bx0=sw,by0=sh,bx1=0,by1=0;
  const colN=new Int32Array(sw),rowN=new Int32Array(sh);
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++)if(img.data[(y*sw+x)*4+3]>128){colN[x]++;rowN[y]++;}
  for(let x=0;x<sw;x++)if(colN[x]>sh*.02){bx0=Math.min(bx0,x);bx1=Math.max(bx1,x);}
  for(let y=0;y<sh;y++)if(rowN[y]>sw*.02){by0=Math.min(by0,y);by1=Math.max(by1,y);}
  if(job.trim){ const [t0,t1,t2,t3]=job.trim, bw=bx1-bx0, bh=by1-by0;   // hand-tuned, as a fraction of the bbox
    [bx0,by0,bx1,by1]=[bx0+bw*t0|0,by0+bh*t1|0,bx0+bw*t2|0,by0+bh*t3|0]; }
  // clear stray islands outside the bbox
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++)if(x<bx0||x>bx1||y<by0||y>by1)img.data[(y*sw+x)*4+3]=0;
  feather(img.data,sw,sh);
  g.putImageData(img,0,0);
  const cw=bx1-bx0+1, ch=by1-by0+1;
  const rot=(job.rot||0)%4, ow=rot%2?ch:cw, oh=rot%2?cw:ch;
  const k=Math.min(1,(job.max||1400)/Math.max(ow,oh));
  const o=document.createElement('canvas');o.width=Math.round(ow*k);o.height=Math.round(oh*k);
  const og=o.getContext('2d');og.translate(o.width/2,o.height/2);og.rotate(rot*Math.PI/2);
  og.drawImage(c,bx0,by0,cw,ch,-cw*k/2,-ch*k/2,cw*k,ch*k);
  const blob=await new Promise(r=>o.toBlob(r,'image/webp',.86));
  if(!P.has('dry')) await fetch('/'+job.out+'.webp',{method:'POST',body:blob});
  const v=document.createElement('div');
  v.innerHTML=`<b>${job.out}</b> ${o.width}x${o.height} ${(blob.size/1024|0)}KB<br>`;
  o.style.maxHeight='190px';o.style.maxWidth='560px';o.style.background='repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/16px 16px';
  v.appendChild(o);document.getElementById('view').appendChild(v);
  return {out:job.out,w:o.width,h:o.height,kb:blob.size/1024|0};
}
(async()=>{const res=[];for(const j of JOBS){if(only&&!only.split(',').includes(j.out))continue;
  try{res.push(await run(j));}catch(e){res.push({out:j.out,err:String(e)});}}
  window.RESULT=res;document.getElementById('log').textContent=JSON.stringify(res);})();
</script>
